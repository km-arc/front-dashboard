openapi: 3.0.3
info:
  title: Store API
  version: 0.1.0
  description: Contract between the front end and the backend. The front end authors it until the backend publishes its own; this file is the single source for the generated types, the client and the sample API.
tags:
  - name: Theming
  - name: Auth
paths:
  /brand:
    get:
      operationId: getBrand
      tags:
        - Theming
      summary: Active brand of the store
      description: Public and cacheable. Colors the store (overrides of the design tokens). The front end validates it before use, so unknown tokens or unsafe values are rejected there.
      responses:
        "200":
          description: The active brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
        default:
          $ref: "#/components/responses/Problem"
  /auth/otp/request:
    post:
      operationId: requestOtp
      tags:
        - Auth
      summary: Send a one-time code to a mobile number
      description: The first step of signing in with a code. The answer says when another code may be requested and how long the code is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequested"
        default:
          $ref: "#/components/responses/Problem"
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags:
        - Auth
      summary: Sign in with a one-time code
      description: The second step of signing in with a code. A mobile number that has no account yet gets one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: passwordLogin
      tags:
        - Auth
      summary: Sign in with a verified mobile number and a password
      description: Only works for an account that already has a password. A wrong mobile number or password gets the same answer, so the response does not reveal which accounts exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLogin"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Problem"
  /auth/session:
    get:
      operationId: getSession
      tags:
        - Auth
      summary: The signed-in user
      description: Needs the token as a Bearer header; answers 401 when it is missing, wrong or expired.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: End the session
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Brand:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,47}$"
          description: Lowercase slug, used as the data-brand attribute.
        name:
          type: string
        radius:
          type: string
          pattern: "^\\d{1,3}(\\.\\d{1,3})?(rem|px)$"
          description: Corner radius, for example 0.5rem.
        light:
          $ref: "#/components/schemas/BrandColors"
        dark:
          $ref: "#/components/schemas/BrandColors"
    BrandColors:
      type: object
      description: Design token name to color. Allowed tokens are listed in COLOR_TOKENS of packages/ui. Values are hex, oklch(), hsl() or rgb() only.
      additionalProperties:
        type: string
        maxLength: 64
    Problem:
      type: object
      description: Error body, RFC 9457 (problem details).
      required:
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    OtpRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - identifier
      properties:
        kind:
          type: string
          enum:
            - mobile
          description: How the user is identified. Email will be added later.
        identifier:
          type: string
          description: The mobile number in the form 09123456789.
    OtpRequested:
      type: object
      required:
        - retryAfterSeconds
        - codeLength
      properties:
        retryAfterSeconds:
          type: integer
          description: Seconds before another code may be requested.
        codeLength:
          type: integer
          description: Number of digits in the code.
    OtpVerify:
      type: object
      additionalProperties: false
      required:
        - kind
        - identifier
        - code
      properties:
        kind:
          type: string
          enum:
            - mobile
        identifier:
          type: string
        code:
          type: string
          description: The digits of the one-time code.
    PasswordLogin:
      type: object
      additionalProperties: false
      required:
        - kind
        - identifier
        - password
      properties:
        kind:
          type: string
          enum:
            - mobile
        identifier:
          type: string
        password:
          type: string
    User:
      type: object
      required:
        - id
        - mobile
      properties:
        id:
          type: string
        mobile:
          type: string
        displayName:
          type: string
    AuthResult:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: Opaque bearer token. The front end keeps it in an httpOnly cookie on the server, never in browser storage.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    SessionInfo:
      type: object
      required:
        - user
        - expiresAt
      properties:
        user:
          $ref: "#/components/schemas/User"
        expiresAt:
          type: string
          format: date-time
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
